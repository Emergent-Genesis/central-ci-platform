name: finance-os | Monthly PDF Report

on:
  schedule:
    - cron: '30 1 1 * *'   # 07:00 AM IST on the 1st of each month
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_PATH }}
          token: ${{ secrets.TOKEN_GITHUB }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r requirements.txt

      - name: Generate monthly PDF report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_ACCESS_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO_NAME: ${{ secrets.PRIVATE_REPO_PATH }}
        run: python -m src.agents.report_generator --mode=monthly
