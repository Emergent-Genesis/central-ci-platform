name: ComfyUI Docker Build

on:
  workflow_dispatch:
    inputs:
      model_profile:
        description: "Select the model profile to build and push to GHCR."
        required: true
        default: "basic"
        type: choice
        options:
          - "basic"
          - "video-model"

jobs:
  build_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Up Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Checkout Private Source Repository
        uses: actions/checkout@v4
        with:
          repository: Emergent-Genesis/comfyui-source-private
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: comfyui-source-private

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ONLY the Selected Image to GHCR
        env:
          COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}
        shell: bash
        run: |
          ls -l
          echo $COMPOSE_PROJECT_NAME
          cd comfyui-source-private
          MODEL_PROFILE=${{ inputs.model_profile }}
          echo "--- Building $MODEL_PROFILE Model---"
          docker compose --profile $MODEL_PROFILE build --push
          echo "Successfully built and pushed image for profile: $MODEL_PROFILE"
