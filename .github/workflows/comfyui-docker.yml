name: ComfyUI Docker Build

on: [workflow_dispatch]

jobs:
  build_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Up Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Checkout Private Source Repository
        uses: actions/checkout@v4
        with:
          repository: ssuriya1/comfyui-source-private
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: comfyui-source-private

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in GITHUB_TOKEN is used for GHCR authentication
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          # Context points to the checked-out subdirectory containing the Dockerfile
          context: comfyui-source-private/
          # Path to the Dockerfile within the context
          file: comfyui-source-private/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
