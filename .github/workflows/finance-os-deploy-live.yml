name: finance-os | Deploy (Firebase Hosting — Live)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: Master

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_PATH }}
          ref: ${{ inputs.branch || 'Master' }}
          token: ${{ secrets.TOKEN_GITHUB }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Inject environment variables
        env:
          API_URL:                 ${{ secrets.API_URL }}
          FIREBASE_API_KEY:        ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:    ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:     ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID:         ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          sed -i \
            -e "s|%%API_URL%%|${API_URL}|g" \
            -e "s|%%FIREBASE_API_KEY%%|${FIREBASE_API_KEY}|g" \
            -e "s|%%FIREBASE_AUTH_DOMAIN%%|${FIREBASE_AUTH_DOMAIN}|g" \
            -e "s|%%FIREBASE_PROJECT_ID%%|${FIREBASE_PROJECT_ID}|g" \
            -e "s|%%FIREBASE_APP_ID%%|${FIREBASE_APP_ID}|g" \
            -e "s|%%FIREBASE_MEASUREMENT_ID%%|${FIREBASE_MEASUREMENT_ID:-}|g" \
            src/environments/environment.prod.ts

      - name: Build Angular app (production)
        run: npm run build:prod

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
