name: finance-os | Monthly Portfolio Analysis

on:
  schedule:
    - cron: '30 14 1 * *'   # 08:00 PM IST on the 1st of each month
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read    # required to pull Ollama image from GHCR

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_PATH }}
          token: ${{ secrets.TOKEN_GITHUB }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r requirements.txt

      - name: Stage 1 — Full data refresh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_ACCESS_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO_NAME: ${{ secrets.PRIVATE_REPO_PATH }}
        run: python -m src.agents.data_fetcher --mode=full_refresh

      - name: Stage 2 — Math engine scoring
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO_NAME: ${{ secrets.PRIVATE_REPO_PATH }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python -m src.agents.math_engine --mode=monthly_score

      - name: Start Ollama
        id: ollama
        uses: ./.github/actions/ollama
        with:
          model_profile: mistral-7b

      - name: Stage 3 — AI advisor (Ollama primary, Gemini fallback)
        env:
          OLLAMA_BASE_URL: ${{ steps.ollama.outputs.ollama_url }}
          OLLAMA_MODEL: "mistral:7b-instruct"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          REPO_ACCESS_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO_NAME: ${{ secrets.PRIVATE_REPO_PATH }}
        run: python -m src.agents.ai_advisor --mode=monthly_cron

      - name: Stage 4 — Notification generation
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          REPO_ACCESS_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO_NAME: ${{ secrets.PRIVATE_REPO_PATH }}
        run: python -m src.agents.firestore_manager --mode=generate_notifications

      - name: Stop Ollama container
        if: always()
        run: docker stop ollama && docker rm ollama || true
