name: finance-os | Deploy Preview (Firebase Hosting)

on:
  repository_dispatch:
    types: [finance-os-deploy-preview]
  workflow_dispatch:
    inputs:
      head_ref:
        description: Branch name to build
        required: true
        default: Master

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private repo (PR branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_PATH }}
          token: ${{ secrets.TOKEN_GITHUB }}
          ref: ${{ github.event.client_payload.head_ref || inputs.head_ref || 'Master' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'
          # cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      - name: Deploy to Firebase Hosting (preview channel)
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.TOKEN_GITHUB }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          target: finance-os-frontend
          entryPoint: .
        # channelId omitted → Firebase auto-creates a unique preview URL

      # Post the preview URL back as a comment on the private repo's PR
      - name: Post preview URL to private repo PR
        if: github.event.client_payload.pr_number != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.firebase_deploy.outputs.details_url }}
        with:
          github-token: ${{ secrets.TOKEN_GITHUB }}
          script: |
            const prNumber = ${{ github.event.client_payload.pr_number || 0 }};
            const [owner, repo] = '${{ secrets.PRIVATE_REPO_PATH }}'.split('/');
            if (prNumber > 0) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body: `🔥 Firebase preview deployed:\n**${process.env.PREVIEW_URL}**\n\nExpires in 7 days.`
              });
            }
