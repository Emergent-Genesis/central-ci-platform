name: ComfyUI Interactive Session (ngrok)

on:
  workflow_dispatch:
    inputs:
      model_profile:
        description: "Select the model profile to run (must be pre-built via comfyui-docker.yml)."
        required: true
        default: "basic"
        type: choice
        options:
          - "basic"
          - "fhdr"
          - "video-model"

      session_duration_hours:
        description: "Duration (hours) to keep the ngrok session alive."
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"

env:
  COMFYUI_PORT: 8188

jobs:
  run_comfyui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free Up Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Code and Docker Compose File
        uses: actions/checkout@v4

      - name: Pull and Run Selected Model with Docker Compose
        env:
          COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        shell: bash
        run: |
          MODEL_PROFILE=${{ inputs.model_profile }}

          echo "--- Pulling and running container for profile: $MODEL_PROFILE ---"
          docker compose --profile $MODEL_PROFILE pull 
          docker compose --profile $MODEL_PROFILE up -d

      - name: Wait for ComfyUI to Start Up
        run: sleep 120

      - name: Start ngrok Tunnel
        id: ngrok
        uses: ./.github/actions/ngrok-tunnel
        with:
          port: ${{ env.COMFYUI_PORT }}
          ngrok_token: ${{ secrets.NGROK_AUTH_TOKEN }}
          service_name: ComfyUI
          session_duration_hours: ${{ github.event.inputs.session_duration_hours }}

      - name: Docker Compose Down (Cleanup)
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ${{ github.repository }}
        run: docker compose down
