name: ComfyUI Interactive Session (ngrok) Old

on:
  workflow_dispatch:
    inputs:
      session_duration_hours:
        description: "Duration (hours) to keep the ngrok session alive."
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"

env:
  COMFYUI_PORT: 8188
  IMAGE_TAG: d57da4163d9d0f8e3d8487c6fc7ab5b322488e65

jobs:
  run_comfyui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free Up Disk Space on Runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Code for Composite Action
        uses: actions/checkout@v4

      - name: Run ComfyUI Container in Background
        run: |
          docker run -d \
            --name comfyui \
            -p ${COMFYUI_PORT}:${COMFYUI_PORT} \
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
            
          echo "ComfyUI container started on port ${COMFYUI_PORT}."

      - name: Wait for ComfyUI to Start Up
        run: sleep 120

      - name: Start ngrok Tunnel
        id: ngrok
        uses: ./.github/actions/ngrok-tunnel
        with:
          port: ${{ env.COMFYUI_PORT }}
          ngrok_token: ${{ secrets.NGROK_AUTH_TOKEN }}
          service_name: ComfyUI
          session_duration_hours: ${{ github.event.inputs.session_duration_hours }}
