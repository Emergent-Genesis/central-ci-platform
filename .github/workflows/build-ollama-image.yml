name: Build Ollama Image (GHCR)

# Builds a Docker image with Ollama + model weights pre-baked.
# Run this once (and again whenever you want to update the model).
# Image is pushed to ghcr.io/<owner>/ollama-<model>:latest
# and used by both finance-os-monthly-analysis.yml and run-ollama.yml.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model profile to bake into the image
        required: true
        default: mistral-7b
        type: choice
        options:
          - mistral-7b

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # required to push to GHCR

    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/ollama-${{ inputs.model }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ollama-${{ inputs.model }}:latest
