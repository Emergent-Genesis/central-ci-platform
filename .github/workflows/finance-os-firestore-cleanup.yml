name: finance-os | Firestore TTL Cleanup

on:
  schedule:
    - cron: '0 19 1 * *'   # 00:30 AM IST on the 1st of each month
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_PATH }}
          token: ${{ secrets.TOKEN_GITHUB }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r requirements.txt

      - name: Run Firestore cleanup
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python -m src.agents.firestore_manager --mode=cleanup
