name: finance-os | Daily Cache Refresh

on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 AM IST every day
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_PATH }}
          token: ${{ secrets.TOKEN_GITHUB }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r requirements.txt

      - name: Run data fetcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_ACCESS_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          REPO_NAME: ${{ secrets.PRIVATE_REPO_PATH }}
        run: python -m src.agents.data_fetcher --mode=daily_cache
