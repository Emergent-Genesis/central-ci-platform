name: finance-os | Sync Backup

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to sync
        required: false
        default: Master

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private repo (full history)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_PATH }}
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0
          ref: ${{ inputs.branch || 'Master' }}

      - name: Push to backup repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          BACKUP_REPO_PATH: ${{ secrets.BACKUP_REPO_PATH }}
        run: |
          git remote add backup \
            https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO_PATH}.git
          git push backup Master --force
