name: "Build & Deploy Web"
description: "Builds the web app and deploys to Firebase Hosting. Code must be checked out by the calling workflow before this action runs."
branding:
  icon: "globe"
  color: "orange"

inputs:
  working_directory:
    description: "Working directory for npm operations (leave empty for root)"
    required: false
    default: ""
  build_command:
    description: "NPM build command"
    required: false
    default: "npm run build:prod"
  firebase_service_account:
    description: "Firebase service account JSON (standard IAM credentials — see README)"
    required: true
  deploy_channel:
    description: "preview or production"
    required: false
    default: "production"
  channel_id:
    description: "Preview channel ID (used when deploy_channel is preview)"
    required: false
    default: ""
  admin_code:
    description: "NEXT_PUBLIC_ADMIN_CODE secret (optional — only needed for projects that use it)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Extract Firebase config
      id: firebase
      uses: ./.github/actions/firebase-config
      with:
        service_account_json: ${{ inputs.firebase_service_account }}

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ inputs.working_directory && format('{0}/**/package-lock.json', inputs.working_directory) || '**/package-lock.json' }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: npm ci

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: ${{ inputs.build_command }}
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${{ steps.firebase.outputs.api_key }}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ steps.firebase.outputs.auth_domain }}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ steps.firebase.outputs.project_id }}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ steps.firebase.outputs.storage_bucket }}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ steps.firebase.outputs.messaging_sender_id }}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${{ steps.firebase.outputs.app_id }}
        NEXT_PUBLIC_ADMIN_CODE: ${{ inputs.admin_code }}

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0  # v0
      with:
        repoToken: ${{ github.token }}
        firebaseServiceAccount: ${{ inputs.firebase_service_account }}
        channelId: ${{ inputs.deploy_channel == 'preview' && inputs.channel_id || 'live' }}
        projectId: ${{ steps.firebase.outputs.project_id }}
        entryPoint: ${{ inputs.working_directory }}
