name: "Build & Deploy Web"
description: "Builds the web app and deploys to Firebase Hosting. Code must be checked out by the calling workflow before this action runs."
branding:
  icon: "globe"
  color: "orange"

inputs:
  working_directory:
    description: "Working directory for npm operations (leave empty for root)"
    required: false
    default: ""
  build_command:
    description: "NPM build command"
    required: false
    default: "npm run build"
  firebase_service_account:
    description: "Firebase service account JSON (standard IAM credentials — see README)"
    required: true
  deploy_channel:
    description: "preview or production"
    required: false
    default: "production"
  channel_id:
    description: "Preview channel ID (used when deploy_channel is preview)"
    required: false
    default: ""
  admin_code:
    description: "ADMIN_CODE secret (optional — only needed for projects that use it)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Extract Firebase config
      id: firebase
      uses: ./.github/actions/firebase-config
      with:
        service_account_json: ${{ inputs.firebase_service_account }}

    - name: Write firebase-config.json
      shell: bash
      env:
        SA_JSON: ${{ inputs.firebase_service_account }}
        ADMIN_CODE: ${{ inputs.admin_code }}
      run: |
        mkdir -p "${{ inputs.working_directory }}/public"
        project_id=$(echo "$SA_JSON" | jq -r '.project_id')
        echo "$SA_JSON" | jq \
          --arg domain "${project_id}.firebaseapp.com" \
          --arg bucket "$(echo "$SA_JSON" | jq -r '.web_storage_bucket // empty' || echo "${project_id}.appspot.com")" \
          --arg admin "$ADMIN_CODE" \
          '{
            apiKey: .web_api_key,
            authDomain: $domain,
            projectId: .project_id,
            storageBucket: $bucket,
            messagingSenderId: .web_messaging_sender_id,
            appId: .web_app_id,
            adminCode: $admin
          }' > "${{ inputs.working_directory }}/public/firebase-config.json"

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ inputs.working_directory && format('{0}/**/package-lock.json', inputs.working_directory) || '**/package-lock.json' }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: npm ci

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: ${{ inputs.build_command }}

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0  # v0
      with:
        repoToken: ${{ github.token }}
        firebaseServiceAccount: ${{ inputs.firebase_service_account }}
        channelId: ${{ inputs.deploy_channel == 'preview' && inputs.channel_id || 'live' }}
        projectId: ${{ steps.firebase.outputs.project_id }}
        entryPoint: ${{ inputs.working_directory }}
