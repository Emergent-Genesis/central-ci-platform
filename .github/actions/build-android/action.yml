name: "Build Android"
description: "Build, sign, and distribute an Android APK via Firebase App Distribution. Auto-generates a keystore if signing secrets are absent. See README for setup."
branding:
  icon: "smartphone"
  color: "green"

inputs:
  api_url:
    description: "Backend API URL"
    required: true
  firebase_service_account_json:
    description: "Firebase service account JSON (standard IAM credentials — see README)"
    required: true
  android_app_id:
    description: "Firebase Android app ID (from Firebase console → Project Settings → Your apps)"
    required: false
    default: ""
  ios_app_id:
    description: "Firebase iOS app ID"
    required: false
    default: ""
  measurement_id:
    description: "Firebase GA4 measurement ID (optional)"
    required: false
    default: ""
  android_signing_key_base64:
    description: "Base64-encoded .jks keystore. Leave empty to auto-generate (see scripts/generate-android-keystore.sh)."
    required: false
    default: ""
  android_key_alias:
    description: "Key alias. Auto-set to 'ci-key' when empty."
    required: false
    default: ""
  android_keystore_password:
    description: "Keystore password. Auto-generated when empty."
    required: false
    default: ""
  android_key_password:
    description: "Key password. Auto-generated when empty."
    required: false
    default: ""
  tester_groups:
    description: "Firebase tester groups (comma-separated)"
    required: false
    default: "testers"
  frontend_directory:
    description: "Relative path to the frontend directory"
    required: false
    default: "frontend"

runs:
  using: "composite"
  steps:
    - name: Extract Firebase config
      id: firebase
      uses: ./.github/actions/firebase-config
      with:
        service_account_json: ${{ inputs.firebase_service_account_json }}
        android_app_id: ${{ inputs.android_app_id }}
        measurement_id: ${{ inputs.measurement_id }}

    - uses: actions/setup-node@v4  # v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ${{ inputs.frontend_directory }}/**/package-lock.json

    - uses: actions/setup-java@v4  # v4
      with:
        java-version: '17'
        distribution: temurin

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3  # v3

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.frontend_directory }}
      run: npm ci

    - name: Inject environment
      shell: bash
      working-directory: ${{ inputs.frontend_directory }}
      env:
        API_URL: ${{ inputs.api_url }}
        FIREBASE_API_KEY: ${{ steps.firebase.outputs.api_key }}
        FIREBASE_AUTH_DOMAIN: ${{ steps.firebase.outputs.auth_domain }}
        FIREBASE_PROJECT_ID: ${{ steps.firebase.outputs.project_id }}
        FIREBASE_APP_ID: ${{ steps.firebase.outputs.app_id }}
        FIREBASE_MEASUREMENT_ID: ${{ steps.firebase.outputs.measurement_id }}
      run: |
        python3 - <<'PYEOF'
        import os, pathlib
        f = pathlib.Path("src/environments/environment.prod.ts")
        c = f.read_text()
        for k, v in {
          "%%API_URL%%":                 os.environ["API_URL"],
          "%%FIREBASE_API_KEY%%":        os.environ["FIREBASE_API_KEY"],
          "%%FIREBASE_AUTH_DOMAIN%%":    os.environ["FIREBASE_AUTH_DOMAIN"],
          "%%FIREBASE_PROJECT_ID%%":     os.environ["FIREBASE_PROJECT_ID"],
          "%%FIREBASE_APP_ID%%":         os.environ["FIREBASE_APP_ID"],
          "%%FIREBASE_MEASUREMENT_ID%%": os.environ["FIREBASE_MEASUREMENT_ID"],
        }.items():
            c = c.replace(k, v)
        f.write_text(c)
        PYEOF

    - name: Build Angular
      shell: bash
      working-directory: ${{ inputs.frontend_directory }}
      run: npm run build:prod

    - name: Capacitor sync
      shell: bash
      working-directory: ${{ inputs.frontend_directory }}
      run: |
        npm install @capacitor/cli @capacitor/android
        npx cap add android
        
        if [ -f "google-services.json" ]; then
          cp google-services.json android/app/google-services.json
        else
          echo "Error: google-services.json was not found in the root of ${{ inputs.frontend_directory }}"
          exit 1
        fi
        
        npx cap sync android

    - name: Build release APK
      shell: bash
      working-directory: ${{ inputs.frontend_directory }}/android
      run: ./gradlew assembleRelease

    - name: Resolve signing credentials and sign APK
      id: sign
      shell: bash
      env:
        SIGNING_KEY_B64: ${{ inputs.android_signing_key_base64 }}
        KEY_ALIAS_IN: ${{ inputs.android_key_alias }}
        STORE_PASS_IN: ${{ inputs.android_keystore_password }}
        KEY_PASS_IN: ${{ inputs.android_key_password }}
        FRONTEND_DIR: ${{ inputs.frontend_directory }}
      run: |
        KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"

        if [[ -n "$SIGNING_KEY_B64" && -n "$KEY_ALIAS_IN" && -n "$STORE_PASS_IN" && -n "$KEY_PASS_IN" ]]; then
          KEY_ALIAS="$KEY_ALIAS_IN"
          STORE_PASS="$STORE_PASS_IN"
          KEY_PASS="$KEY_PASS_IN"
          echo "$SIGNING_KEY_B64" | base64 --decode > "$KEYSTORE_PATH"
        else
          echo "No signing secrets provided — generating a self-signed CI keystore."
          echo "Run scripts/generate-android-keystore.sh locally to create a reusable one."
          KEY_ALIAS="${KEY_ALIAS_IN:-ci-key}"
          STORE_PASS="${STORE_PASS_IN:-$(openssl rand -base64 16)}"
          KEY_PASS="${KEY_PASS_IN:-$(openssl rand -base64 16)}"
          keytool -genkeypair -v \
            -keystore  "$KEYSTORE_PATH" \
            -alias     "$KEY_ALIAS" \
            -keyalg    RSA \
            -keysize   2048 \
            -validity  3650 \
            -storepass "$STORE_PASS" \
            -keypass   "$KEY_PASS" \
            -dname     "CN=CI Build, OU=CI, O=Organisation, L=Unknown, ST=Unknown, C=US" \
            -storetype JKS
        fi

        echo "::add-mask::$STORE_PASS"
        echo "::add-mask::$KEY_PASS"

        APK_DIR="${FRONTEND_DIR}/android/app/build/outputs/apk/release"
        UNSIGNED_APK=$(find "$APK_DIR" -name "*-unsigned*.apk" | head -1)
        
        # 1. Locate zipalign dynamically within the Android SDK build-tools
        ZIPALIGN_BIN=$(find $ANDROID_HOME/build-tools/ -name "zipalign" | sort -V | tail -n 1)
        if [ -z "$ZIPALIGN_BIN" ]; then
          echo "❌ zipalign tool not found in Android SDK!"
          exit 1
        fi
        
        # 2. Align the unsigned APK first
        ALIGNED_APK="${RUNNER_TEMP}/app-release-aligned.apk"
        echo "Aligning APK using: $ZIPALIGN_BIN"
        $ZIPALIGN_BIN -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

        # 3. Sign the *aligned* APK using jarsigner
        SIGNED_APK="${RUNNER_TEMP}/app-release-signed.apk"

        jarsigner -verbose \
          -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore "$KEYSTORE_PATH" \
          -storepass "$STORE_PASS" \
          -keypass   "$KEY_PASS" \
          -signedjar "$SIGNED_APK" \
          "$ALIGNED_APK" "$KEY_ALIAS"

        echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

    - name: Distribute via Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1  # v1
      with:
        appId: ${{ steps.firebase.outputs.android_app_id }}
        serviceCredentialsFileContent: ${{ inputs.firebase_service_account_json }}
        groups: ${{ inputs.tester_groups }}
        file: ${{ steps.sign.outputs.signed_apk }}
